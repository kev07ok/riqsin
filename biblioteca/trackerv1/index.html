<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIQSIN</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#f5f1e8;margin:0}.wrap{max-width:980px;margin:0 auto;padding:100px 24px 80px}.card{border:1.5px solid #e8e0d0;border-radius:24px;padding:32px;background:white}.btn{background:#111;color:#f5f1e8;padding:14px 22px;border-radius:12px;font-weight:800;border:0;cursor:pointer;width:100%;font-size:15px}</style>
</head>
<body>
<script src="/header.js"></script>
<div class="wrap" id="app"><p style="color:#8a7a60;">Cargando producto...</p></div>
<script src="/footer.js?v=1"></script>
<script>
// ============================================================================
// // CONFIG - No tocar, ya con tu clave
// ============================================================================
const SUPABASE_URL = "https://ubxykcmbbiitlaeihpqxr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHlrY21iYml0bGFlaWhwY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjczNjEsImV4cCI6MjEwNDY0MzM2MX0.GLaHeLyNSLVeD-xvqBmoWScN_fwyiP4xByQJfjHwOiI";
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// // DETECTA EN QUE CARPETA ESTA - Universal para todos los productos
// // /biblioteca/piloto/ -> piloto
// // /biblioteca/v1/ -> v1
// // /biblioteca/trackerv1/ -> trackerv1
const FOLDER = window.location.pathname.split('/').filter(Boolean).pop().toLowerCase(); // // No tocar

async function cargar(){
  const app = document.getElementById('app');
  try{
    // // BUSCA EN SUPABASE: cualquier archivo que CONTENGA el nombre de la carpeta
    // // Ej: si carpeta es trackerv1, encuentra trackerv1.pdf, tracker-v1.pdf, etc.
    // // Si carpeta es piloto, encuentra piloto.pdf, pruebapiloto.pdf, etc.
    const { data: prods, error } = await supa.from('productos')
      .select('*')
      .ilike('archivo_nombre', `%${FOLDER}%`)
      .eq('estado','disponible');

    if(error) throw error;
    if(!prods || prods.length === 0) throw new Error(`No hay ningún producto con archivo que contenga "${FOLDER}" - Revisá en Supabase que el archivo_nombre contenga "${FOLDER}"`);

    // // Si hay varios que coinciden (ej: piloto y pruebapiloto), agarra el primero
    const prod = prods[0];

    // // PINTA LA PAGINA
    document.title = prod.nombre + ' — RIQSIN';
    app.innerHTML = `
      <a href="/biblioteca/" style="font-size:12px;color:#8a7a60;text-decoration:none;">← Volver a biblioteca</a>
      <h1 style="font-size:48px;letter-spacing:-1.8px;margin:12px 0;">${prod.nombre}</h1>
      <p style="color:#666;max-width:600px;line-height:1.6;">${prod.descripcion||''}</p>
      <div style="display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:32px;">
        <div class="card" style="aspect-ratio:1.6/1;display:grid;place-items:center;color:#8a7a60;">📄 ${prod.archivo_nombre}</div>
        <div class="card">
          <h3 style="margin:0;">${prod.nombre}</h3>
          <p style="color:#666;font-size:13px;">Entrega inmediata • PDF privado</p>
          <p style="font-size:28px;font-weight:900;margin:16px 0;">$ ${prod.precio}</p>
          <button id="buy" class="btn">Pagar y descargar</button>
          <p id="msg" style="font-size:11px;color:#8a7a60;margin-top:12px;"></p>
          <p style="font-size:10px;color:#bbb;margin-top:18px;">Carpeta: ${FOLDER} | Archivo: ${prod.archivo_nombre}</p>
        </div>
      </div>`;

    // // BOTON DESCARGA SEGURA (bucket privado)
    document.getElementById('buy').onclick = async () => {
      const btn = document.getElementById('buy'); const msg = document.getElementById('msg');
      btn.innerText='Procesando...'; btn.disabled=true;
      try{
        await supa.from('compras').insert({ producto_id: prod.id, archivo_nombre: prod.archivo_nombre, precio_pagado: prod.precio, email: 'anon' });
        const { data: fileData, error: downErr } = await supa.storage.from('productos').download(prod.archivo_nombre);
        if(downErr) throw new Error(downErr.message);
        const url = URL.createObjectURL(fileData);
        const a = document.createElement('a'); a.href=url; a.download=prod.archivo_nombre; a.click();
        msg.innerText='¡Descarga iniciada!'; btn.innerText='¡Descargado!';
      }catch(e){ msg.innerText='Error: '+e.message; btn.innerText='Reintentar'; btn.disabled=false; }
    };

  }catch(e){ app.innerHTML = `<p style="color:red;">Error: ${e.message}</p><p style="font-size:12px;">Carpeta detectada: ${FOLDER}</p><a href="/biblioteca/">← Volver</a>`; }
}
cargar();
</script>
<!--
 // ESTE ARCHIVO ES UNIVERSAL - Sirve para TODOS los productos
 // Copialo tal cual a:
 // /biblioteca/piloto/index.html
 // /biblioteca/v1/index.html
 // /biblioteca/trackerv1/index.html
 // /biblioteca/cualquier-otro/index.html
 //
 // Como funciona: lee el nombre de la carpeta y busca en Supabase
 // un archivo que contenga ese nombre.
 //
 // Requisitos en Supabase:
 // - En Storage > productos: el PDF tiene que existir
 // - En Table productos: archivo_nombre tiene que contener el nombre de la carpeta
 //   Ej: carpeta v1 + archivo v1.pdf OK
 //   Ej: carpeta piloto + archivo pruebapiloto.pdf OK (porque contiene piloto)
-->
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIQSIN v.1 | Método RIQSIN</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
   .biblio-hero{ max-width:900px; margin:0 auto; padding:100px 40px 20px 40px; }
   .biblio-hero h1{ font-size:clamp(32px, 5vw, 52px); letter-spacing:-1.5px; line-height:0.9; margin:10px 0; }
   .biblio-lista{ max-width:900px; margin:0 auto; padding:20px 40px 80px 40px; }
   .caja{ background:white; border:1.5px solid var(--beige-oscuro); border-radius:20px; padding:28px; margin-top:30px; }
   .btn-principal{ background:var(--carbon); color:var(--beige)!important; padding:14px 24px; border-radius:10px; text-decoration:none; font-weight:700; border:none; cursor:pointer; display:inline-block; }
   .btn-principal:disabled{ opacity:0.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <script src="/header.js"></script>

  <section class="biblio-hero">
    <a href="/biblioteca/" style="text-decoration:none; font-size:13px; color:#888;">← Volver a Biblioteca</a>
    <span class="eyebrow" style="display:block; margin-top:24px; color:var(--dorado); font-size:11px; letter-spacing:2px; font-weight:700;">MÉTODO RIQSIN — V1.0</span>
    <h1 id="prod-nombre">Cargando...</h1>
    <p id="prod-desc" style="color:#666; line-height:1.6; max-width:600px;"></p>
    <p id="prod-estado" style="margin-top:10px; font-size:11px; font-weight:700; letter-spacing:1px;"></p>
  </section>

  <section class="biblio-lista">
    <div>
      <h3>¿Para quién es?</h3>
      <p style="color:#555; line-height:1.6; font-size:14px;">Jóvenes de 15 a 30 años que buscan estructurar su disciplina, mejorar hábitos y alinear sus valores con su proyecto de vida. No es motivación, es un sistema.</p>
    </div>

    <div id="caja-compra" class="caja">
      <p style="text-align:center; color:#999;">Cargando acceso...</p>
    </div>
  </section>

<script>
  const SUPABASE_URL = 'https://ubxykcmbbitlaeihpcxr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHlrY21iYml0bGFlaWhwY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjczNjEsImV4cCI6MjEwNDY0MzM2MX0.GLaHeLyNSLVeD-xvqBmoWScN_fwyiP4xByQJfjHwOiI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let productoActual = null;

  async function init(){
    const { data: prods } = await supabaseClient.from('productos').select('*').eq('archivo_nombre','riqsin-v1.pdf').limit(1);
    if(!prods || prods.length === 0){
      document.getElementById('prod-nombre').innerText = 'Producto no encontrado';
      return;
    }
    productoActual = prods[0];
    document.getElementById('prod-nombre').innerText = productoActual.nombre;
    document.getElementById('prod-desc').innerText = productoActual.descripcion;

    const estadoEl = document.getElementById('prod-estado');
    const esDisponible = productoActual.estado === 'disponible' || productoActual.estado === 'publicado';

    if(!esDisponible){
      estadoEl.innerText = `● ${productoActual.estado.replace('_',' ').toUpperCase()} — AÚN NO DISPONIBLE PARA VENTA`;
      estadoEl.style.color = '#999';
    } else {
      estadoEl.innerText = `● DISPONIBLE`;
      estadoEl.style.color = '#2e7d32';
    }

    const { data: { user } } = await supabaseClient.auth.getUser();
    const caja = document.getElementById('caja-compra');

    if(!user){
      caja.innerHTML = `
        <h3>Acceso a ${productoActual.nombre}</h3>
        <p style="color:#666; font-size:14px;">Necesitás cuenta para comprar. Cuando esté disponible, se habilita el pago.</p>
        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:800; font-size:20px;">$ ${productoActual.precio.toLocaleString('es-AR')}</span>
          <a href="/mi-cuenta/" class="btn-principal">Crear cuenta</a>
        </div>
        ${!esDisponible? `<p style="font-size:12px; color:#c00; margin-top:12px;">Este producto está en ${productoActual.estado.replace('_',' ')} y no se puede comprar todavía.</p>` : ''}
      `;
      return;
    }

    const { data: compras } = await supabaseClient.from('compras').select('*').eq('user_id', user.id).eq('producto_id', productoActual.id);
    const yaCompro = compras && compras.length > 0;

    if(yaCompro){
      caja.innerHTML = `
        <span style="background:#e8f5e9; color:#2e7d32; font-size:10px; font-weight:700; padding:6px 12px; border-radius:999px;">ACCESO ACTIVO</span>
        <h3 style="margin-top:12px;">Ya tenés acceso a ${productoActual.nombre}</h3>
        <p style="color:#666; font-size:14px;">Tu compra está registrada. Podés descargar el PDF en tu cuenta.</p>
        <div style="margin-top:20px;">
          <a href="/mi-cuenta/" class="btn-principal">Ir a Mis versiones →</a>
        </div>
      `;
    } else {
      if(!esDisponible){
        caja.innerHTML = `
          <h3>${productoActual.nombre} — En desarrollo</h3>
          <p style="color:#666; font-size:14px;">Estamos terminando esta versión. No se puede comprar todavía. Cuando cambies el estado a 'disponible' en Supabase, se habilita solo.</p>
          <p style="margin-top:16px; font-size:12px; color:#999;">Precio de lanzamiento: $ ${productoActual.precio.toLocaleString('es-AR')}</p>
        `;
      } else {
        caja.innerHTML = `
          <h3>Acceso completo a ${productoActual.nombre}</h3>
          <p style="color:#666; font-size:14px;">Incluye PDF + actualizaciones de la v1. Pago seguro con Mercado Pago.</p>
          <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <span style="font-size:22px; font-weight:800;">$ ${productoActual.precio.toLocaleString('es-AR')}</span>
            <button onclick="comprarMP()" id="btn-comprar" class="btn-principal">Comprar con Mercado Pago →</button>
          </div>
        `;
      }
    }
  }

  async function comprarMP(){
    const btn = document.getElementById('btn-comprar');
    btn.innerText = 'Redirigiendo a Mercado Pago...'; btn.disabled = true;

    // Llama a tu Edge Function que crea la preferencia de MP
    const { data: { session } } = await supabaseClient.auth.getSession();

    const res = await fetch(`${SUPABASE_URL}/functions/v1/crear-pago-mp`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ producto_id: productoActual.id })
    });

    const data = await res.json();
    if(data.init_point){
      window.location.href = data.init_point;
    } else {
      alert('Error creando pago: ' + (data.error || 'desconocido'));
      btn.innerText = 'Comprar con Mercado Pago →'; btn.disabled = false;
    }
  }

  init();
</script>
<script src="/footer.js?v=1"></script>
</body>
</html>

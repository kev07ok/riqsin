<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIQSIN — Piloto</title>
<link rel="stylesheet" href="/style.css">
<!-- // LIBRERIA SUPABASE - Necesaria para traer el producto y descargar -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f5f1e8;margin:0;}
.wrap{max-width:980px;margin:0 auto;padding:100px 24px 80px;}
.card{border:1.5px solid #e8e0d0;border-radius:24px;padding:32px;background:white;}
.btn{background:#111;color:#f5f1e8;padding:14px 22px;border-radius:12px;font-weight:800;border:0;cursor:pointer;width:100%;font-size:15px;display:block;text-align:center;text-decoration:none;transition:.2s;}
.btn:hover{background:#b8985a;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
</style>
</head>
<body>
<script src="/header.js"></script>
<div class="wrap" id="app">
  <!-- // Mientras carga Supabase muestra esto -->
  <p style="color:#8a7a60;">Cargando producto...</p>
</div>
<script src="/footer.js?v=1"></script>
<script>
// ============================================================================
// // CONFIG SUPABASE - Ya con tu clave, no tocar
// ============================================================================
const SUPABASE_URL = "https://ubxykcmbbiitlaeihpqxr.supabase.co"; // // URL de tu proyecto
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHlrY21iYml0bGFlaWhwY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjczNjEsImV4cCI6MjEwNDY0MzM2MX0.GLaHeLyNSLVeD-xvqBmoWScN_fwyiP4xByQJfjHwOiI"; // // Tu clave anon
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// // QUE PRODUCTO ES ESTE? - Lo saca de la URL /biblioteca/piloto/ -> piloto
// // Si duplicas esta carpeta para otro producto, cambia esta variable o deja que lo detecte solo
const FOLDER = window.location.pathname.split('/').filter(Boolean).pop() || 'piloto'; // // piloto

async function cargar(){
  const app = document.getElementById('app');
  try{
    // // 1. BUSCA EL PRODUCTO EN TU TABLA - Busca el que tenga archivo_nombre que empiece con 'piloto'
    // // Ej: si en Storage subiste piloto.pdf, acá lo encuentra
    const { data: prod, error } = await supa.from('productos')
      .select('*')
      .ilike('archivo_nombre', FOLDER + '%') // // Busca piloto% -> piloto.pdf, piloto_v2.pdf, etc.
      .eq('estado','disponible')
      .single();

    if(error || !prod) throw new Error('No se encontró el producto: ' + FOLDER + ' - Revisá que en la tabla productos el archivo_nombre empiece con piloto');

    // // 2. PINTA LA PAGINA CON LOS DATOS DE SUPABASE
    app.innerHTML = `
      <a href="/biblioteca/" style="font-size:12px;color:#8a7a60;text-decoration:none;">← Volver a biblioteca</a>
      <h1 style="font-size:48px;letter-spacing:-1.8px;margin:12px 0;">${prod.nombre}</h1>
      <p style="color:#666;max-width:600px;line-height:1.6;">${prod.descripcion || 'Versión inicial del sistema RIQSIN.'}</p>
      
      <div style="display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:32px;">
        <div class="card" style="aspect-ratio:1.6/1;display:grid;place-items:center;font-size:14px;color:#8a7a60;">
          <!-- // ACA VA LA PREVIEW DE TU PDF - Por ahora texto, después podes poner imagen -->
          📄 ${prod.archivo_nombre}
        </div>
        <div class="card">
          <h3 style="margin:0;">${prod.nombre}</h3>
          <p style="color:#666;font-size:13px;margin:6px 0;">Entrega inmediata • PDF privado</p>
          <p style="font-size:28px;font-weight:900;margin:16px 0;">$ ${prod.precio}</p>
          
          <!-- // BOTON DE PAGO Y DESCARGA -->
          <button id="buy" class="btn">Pagar y descargar</button>
          <p id="msg" style="font-size:11px;color:#8a7a60;margin-top:12px;line-height:1.4;"></p>
          
          <!-- // INFO PARA VOS -->
          <p style="font-size:10px;color:#bbb;margin-top:18px;">ID: ${prod.id} | Archivo: ${prod.archivo_nombre} | Bucket privado</p>
        </div>
      </div>
    `;

    // // 3. CUANDO TOCAN PAGAR Y DESCARGAR
    document.getElementById('buy').onclick = async () => {
      const btn = document.getElementById('buy');
      const msg = document.getElementById('msg');
      btn.innerText = 'Procesando...';
      btn.disabled = true;
      msg.innerText = 'Guardando compra y preparando descarga...';

      try{
        // // A. GUARDA LA COMPRA EN TU TABLA compras - Para tener registro de quien bajó
        // // Aca podes agregar email si despues pones login, por ahora guarda anon
        const { error: compraErr } = await supa.from('compras').insert({
          producto_id: prod.id,
          archivo_nombre: prod.archivo_nombre,
          precio_pagado: prod.precio,
          email: 'anon' // // Si agregas login, cambia por el email del usuario
        });
        if(compraErr) console.warn('No se pudo guardar compra (no pasa nada):', compraErr.message);

        // // B. DESCARGA EL PDF DESDE STORAGE PRIVADO - Funciona aunque el bucket esté en PRIVADO
        // // No usa link público, usa la API de Supabase (seguro)
        const { data: fileData, error: downErr } = await supa.storage.from('productos').download(prod.archivo_nombre);
        if(downErr) throw new Error('Error descargando: ' + downErr.message + ' - Revisá que el PDF exista en Storage > productos con ese nombre exacto');

        // // C. CREA EL LINK DE DESCARGA EN EL NAVEGADOR
        const url = URL.createObjectURL(fileData);
        const a = document.createElement('a');
        a.href = url;
        a.download = prod.archivo_nombre; // // Nombre con el que se baja
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        msg.innerText = '¡Descarga iniciada! Gracias por tu compra.';
        btn.innerText = '¡Descargado!';

      }catch(e){
        console.error(e);
        msg.innerText = 'Error: ' + e.message;
        btn.innerText = 'Reintentar';
        btn.disabled = false;
      }
    };

  }catch(e){
    app.innerHTML = `<p style="color:red;">Error: ${e.message}</p><p style="font-size:12px;color:#666;">Revisá: 1) Que en Supabase > productos exista una fila con archivo_nombre que empiece con '${FOLDER}' 2) Que estado = disponible 3) Que el PDF exista en Storage > productos</p><a href="/biblioteca/">← Volver</a>`;
  }
}
cargar();
</script>

<!--
================================================================================
 // COMO DUPLICAR ESTO PARA OTRO PRODUCTO:

 1. Duplicá la carpeta /biblioteca/piloto/ entera
    Ej: /biblioteca/mi-nuevo-producto/

 2. No tenes que tocar nada de este archivo.
    Solo detecta el nombre de la carpeta (mi-nuevo-producto) y busca en Supabase
    un producto cuyo archivo_nombre empiece con mi-nuevo-producto

    Entonces en tu tabla productos tenes que tener:
    archivo_nombre: mi-nuevo-producto.pdf

 3. Si querés forzar que sea otro archivo, cambia esta linea arriba:
    const FOLDER = 'piloto'  -> const FOLDER = 'mi-nuevo-producto'

 // PARA CAMBIAR EL PRECIO, NOMBRE, DESCRIPCION:
    No se toca acá. Se cambia en Supabase > Table Editor > productos
    Este archivo lo trae automático.

 // SEGURIDAD:
    El bucket productos tiene que estar en PRIVADO (toggle gris)
    Asi nadie puede bajarlo con link directo, solo por este boton que registra la compra.
================================================================================
-->
</body>
</html>

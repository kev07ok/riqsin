<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca — RIQSIN</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --beige:#f5f1e8; --line:#e8e0d0; --gold:#b8985a; --black:#111; }
*{box-sizing:border-box}
body{background:var(--beige);margin:0;}
.wrap{max-width:1200px;margin:0 auto;padding:100px 24px 80px;}
.head-row{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:48px 0 16px;}
.head-row h2{font-size:28px;letter-spacing:-1px;margin:0;line-height:.9;}
.head-row p{color:#8a7a60;font-size:13px;margin:6px 0 0;}
.controls{display:flex;gap:8px;}
.ctrl{width:38px;height:38px;border-radius:999px;border:1.5px solid var(--line);background:white;cursor:pointer;display:grid;place-items:center;transition:.2s;}
.ctrl:hover{border-color:var(--gold);transform:translateY(-1px);}
.scroller{position:relative;}
.row{ display:flex; gap:18px; overflow-x:auto; overflow-y:hidden; padding:10px 4px 24px; scroll-snap-type:x mandatory; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
.row::-webkit-scrollbar{display:none;}
.row{scrollbar-width:none;}
.card{ min-width:320px; max-width:320px; background:white; border:1.5px solid var(--line); border-radius:22px; padding:26px; scroll-snap-align:start; text-decoration:none; color:inherit; display:flex; flex-direction:column; justify-content:space-between; transition: all .35s cubic-bezier(.2,.8,.2,1); opacity:0; transform: translateY(12px) scale(.98); }
.card.visible{opacity:1; transform: translateY(0) scale(1);}
.card.disponible{border-color:var(--gold);}
.card.no-disponible{opacity:.55;pointer-events:none;}
.card:hover{transform:translateY(-6px) scale(1.01); box-shadow:0 18px 40px rgba(0,0,0,.08);}
.badge{font-size:10px;padding:6px 12px;border-radius:999px;font-weight:800;letter-spacing:.6px;width:fit-content;}
.badge-dispo{background:var(--black);color:var(--beige);}
.badge-nd{background:var(--line);color:#8a7a60;}
.badge-gold{background:var(--gold);color:white;}
.price{font-size:22px;font-weight:900;letter-spacing:-.5px;}
.fade-up{animation: fadeUp .6s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.skeleton{min-width:320px;height:220px;background:linear-gradient(90deg,#eee8d8 25%,#f5f1e8 50%,#eee8d8 75%);background-size:200% 100%;animation: shimmer 1.2s infinite;border-radius:22px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<script src="/header.js"></script>
<div class="wrap">
  <section class="fade-up">
    <span style="color:var(--gold);font-size:11px;letter-spacing:2px;font-weight:800;">BIBLIOTECA RIQSIN</span>
    <h1 style="font-size:54px;letter-spacing:-2px;line-height:.85;margin:12px 0 0;">Todo tu sistema.<br>En un lugar.</h1>
    <p style="color:#666;max-width:560px;line-height:1.6;margin-top:14px;">Se actualiza solo desde Supabase. Subís un PDF y aparece acá sin tocar código. Versiones de RIQSIN arriba, herramientas y trackers abajo.</p>
  </section>

  <!-- FILA 1: VERSIONES RIQSIN -->
  <div class="head-row fade-up" style="animation-delay:.05s">
    <div>
      <h2>Versiones de RIQSIN</h2>
      <p>Método completo, pilotos y v1</p>
    </div>
    <div class="controls">
      <button class="ctrl" onclick="scrollRow('row-riqsin', -340)">‹</button>
      <button class="ctrl" onclick="scrollRow('row-riqsin', 340)">›</button>
    </div>
  </div>
  <div class="scroller"><div class="row" id="row-riqsin"></div></div>

  <!-- FILA 2: HERRAMIENTAS / OTROS -->
  <div class="head-row fade-up" style="animation-delay:.1s">
    <div>
      <h2>Herramientas y recursos</h2>
      <p>Trackers, plantillas y extras</p>
    </div>
    <div class="controls">
      <button class="ctrl" onclick="scrollRow('row-tools', -340)">‹</button>
      <button class="ctrl" onclick="scrollRow('row-tools', 340)">›</button>
    </div>
  </div>
  <div class="scroller"><div class="row" id="row-tools"></div></div>

  <p id="status" style="text-align:center;color:#999;font-size:12px;margin-top:20px;"></p>
</div>
<script src="/footer.js?v=1"></script>
<script>
const SUPABASE_URL = "https://ubxykcmbbiitlaeihpqxr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHlrY21iYml0bGFlaWhwY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjczNjEsImV4cCI6MjEwNDY0MzM2MX0.GLaHeLyNSLVeD-xvqBmoWScN_fwyiP4xByQJfjHwOiI";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function scrollRow(id, dx){ document.getElementById(id).scrollBy({left:dx, behavior:'smooth'}); }

function isVersion(p){
  const n = (p.nombre||'').toLowerCase();
  const a = (p.archivo_nombre||'').toLowerCase();
  // Todo lo que sea metodo riqsin, piloto, v1, fundamentos -> fila de arriba
  return (n.includes('riqsin') && (n.includes('metodo') || n.includes('v1') || n.includes('piloto') || n.includes('fundamento') || a.includes('riqsin') || a.includes('piloto'))) || a.includes('riqsinv1');
}
function isTool(p){ return !isVersion(p); }

function cardHTML(p, i){
  const disponible = (p.estado||'').toLowerCase() === 'disponible';
  const link = disponible ? `/biblioteca/${p.archivo_nombre.replace('.pdf','')}/` : '#';
  const badge = disponible ? `<span class="badge badge-dispo">DISPONIBLE</span>` : `<span class="badge badge-nd">NO DISPONIBLE</span>`;
  const price = disponible ? `$ ${Number(p.precio).toLocaleString('es-AR')}` : `$ ${Number(p.precio).toLocaleString('es-AR')}`;
  return `<a href="${link}" class="card ${disponible?'disponible':'no-disponible'}" style="transition-delay:${i*0.06}s">
    ${badge}
    <div>
      <h3 style="margin:16px 0 8px;font-size:20px;line-height:1.1;">${p.nombre}</h3>
      <p style="color:#666;font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${p.descripcion||''}</p>
    </div>
    <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;">
      <span class="price">${price}</span>
      <span style="background:${disponible?'#b8985a':'#ddd'};color:${disponible?'white':'#999'};padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;">${disponible?'Ver →':'Pronto'}</span>
    </div>
  </a>`;
}

async function load(){
  const rowV = document.getElementById('row-riqsin');
  const rowT = document.getElementById('row-tools');
  const status = document.getElementById('status');
  rowV.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  rowT.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';

  const { data, error } = await supa.from('productos').select('*').order('precio',{ascending:true});
  if(error){ status.innerText = "Error: "+error.message; return; }

  const versiones = data.filter(isVersion);
  const tools = data.filter(isTool);

  // Si no hay productos en una categoria, igual mostramos todos en herramientas para no quedar vacio
  const versionesFinal = versiones.length ? versiones : [];
  const toolsFinal = tools.length ? tools : (versiones.length ? [] : data);

  rowV.innerHTML = "";
  rowT.innerHTML = "";

  if(versionesFinal.length===0){
    rowV.innerHTML = `<div style="color:#999;font-size:13px;padding:20px;">No hay versiones marcadas como disponibles. Marca en Supabase estado='disponible' para los que sean método RIQSIN.</div>`;
  } else {
    versionesFinal.forEach((p,i)=>{ rowV.insertAdjacentHTML('beforeend', cardHTML(p,i)); });
  }

  if(toolsFinal.length===0){
    rowT.innerHTML = `<div style="color:#999;font-size:13px;padding:20px;">Subí tu primer tracker a Supabase y aparece acá automático.</div>`;
  } else {
    toolsFinal.forEach((p,i)=>{ rowT.insertAdjacentHTML('beforeend', cardHTML(p,i)); });
  }

  // animacion on scroll
  const obs = new IntersectionObserver((entries)=>{ entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); }); }, {threshold:.15});
  document.querySelectorAll('.card').forEach(c=>obs.observe(c));
  // reveal inicial
  setTimeout(()=>{ document.querySelectorAll('.card').forEach(c=>c.classList.add('visible')); },100);

  status.innerText = `${data.length} productos • ${versionesFinal.length} versiones • ${toolsFinal.length} herramientas • Actualizado desde Supabase`;
}
load();

// drag to scroll con mouse
document.querySelectorAll('.row').forEach(row=>{
  let isDown=false,startX,scrollLeft;
  row.addEventListener('mousedown', e=>{ isDown=true; row.classList.add('drag'); startX=e.pageX-row.offsetLeft; scrollLeft=row.scrollLeft; });
  row.addEventListener('mouseleave', ()=>{ isDown=false; });
  row.addEventListener('mouseup', ()=>{ isDown=false; });
  row.addEventListener('mousemove', e=>{ if(!isDown) return; e.preventDefault(); const x=e.pageX-row.offsetLeft; row.scrollLeft=scrollLeft-(x-startX); });
});
</script>
</body>
</html>

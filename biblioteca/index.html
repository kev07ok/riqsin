<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca — RIQSIN</title>
<link rel="stylesheet" href="/style.css">
<style>
:root{ --beige:#f5f1e8; --line:#e8e0d0; --gold:#b8985a; --black:#111; }
body{background:var(--beige);margin:0;}
.wrap{max-width:1200px;margin:0 auto;padding:100px 24px 80px;}
.row{ display:flex; gap:18px; overflow-x:auto; padding:10px 4px 24px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.row::-webkit-scrollbar{display:none;}
.row{scrollbar-width:none;}
.card{ min-width:320px; max-width:320px; background:white; border:1.5px solid #e8e0d0; border-radius:22px; padding:26px; scroll-snap-align:start; text-decoration:none; color:inherit; display:flex; flex-direction:column; justify-content:space-between; transition:.25s; }
.card:hover{transform:translateY(-6px); border-color:#b8985a; box-shadow:0 18px 40px rgba(0,0,0,.08);}
.badge{font-size:10px;padding:6px 12px;border-radius:999px;font-weight:800;letter-spacing:.6px;width:fit-content;background:#111;color:#f5f1e8;}
.price{font-size:22px;font-weight:900;}
</style>
</head>
<body>
<script src="/header.js"></script>
<div class="wrap">
  <span style="color:#b8985a;font-size:11px;letter-spacing:2px;font-weight:800;">BIBLIOTECA RIQSIN</span>
  <h1 style="font-size:54px;letter-spacing:-2px;line-height:.85;margin:12px 0 0;">Todo tu sistema.<br>En un lugar.</h1>
  <p style="color:#666;max-width:560px;line-height:1.6;margin-top:14px;">Tocá y entrá directo.</p>

  <h2 style="margin:48px 0 16px;font-size:28px;letter-spacing:-1px;">Versiones de RIQSIN</h2>
  <div class="row">
    <a href="/biblioteca/piloto/" class="card">
      <span class="badge">DISPONIBLE</span>
      <div>
        <h3 style="margin:16px 0 8px;font-size:20px;">RIQSIN — Prueba Piloto</h3>
        <p style="color:#666;font-size:13px;line-height:1.5;">La versión inicial para probar el sistema.</p>
      </div>
      <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;">
        <span class="price">$10</span>
        <span style="background:#b8985a;color:white;padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;">Ver →</span>
      </div>
    </a>
  </div>

  <h2 style="margin:48px 0 16px;font-size:28px;letter-spacing:-1px;">Herramientas</h2>
  <div class="row">
    <a href="/biblioteca/trackerv1/" class="card">
      <span class="badge">DISPONIBLE</span>
      <div>
        <h3 style="margin:16px 0 8px;font-size:20px;">RIQSIN — Tracker v1</h3>
        <p style="color:#666;font-size:13px;line-height:1.5;">Tu sistema mensual de hábitos y foco.</p>
      </div>
      <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;">
        <span class="price">$1.500</span>
        <span style="background:#b8985a;color:white;padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;">Ver →</span>
      </div>
    </a>
  </div>

</div>
<script src="/footer.js?v=1"></script>
</body>
</html>

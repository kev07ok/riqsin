<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca RIQSIN — Productos en curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--beige:#f5f1e8;--black:#111;--gold:#b8985a;--line:#e8e0d0}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--beige);
    color:var(--black);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top:64px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* header placeholder injected by /header.js - 64px height */
  .riq-biblioteca{
    min-height:calc(100vh - 64px - 72px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px 80px;
  }
  .riq-wrap{
    width:100%;
    max-width:640px;
    text-align:center;
  }
  .riq-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--black);
    background:rgba(255,255,255,.55);
    margin-bottom:32px;
  }
  .riq-badge-dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 0 rgba(184,152,90,.4);
    animation:dotPulse 2.2s infinite;
  }
  @keyframes dotPulse{
    0%{box-shadow:0 0 0 0 rgba(184,152,90,.5)}
    70%{box-shadow:0 0 0 8px rgba(184,152,90,0)}
    100%{box-shadow:0 0 0 0 rgba(184,152,90,0)}
  }
  .riq-title{
    font-size:clamp(32px,5vw,48px);
    font-weight:600;
    letter-spacing:-.03em;
    line-height:.95;
    margin-bottom:16px;
  }
  .riq-title em{
    font-style:normal;
    font-weight:300;
    color:var(--gold);
  }
  .riq-cartel{
    font-size:clamp(16px,2.2vw,19px);
    font-weight:400;
    letter-spacing:-.01em;
    margin-bottom:14px;
  }
  .riq-sub{
    font-size:14px;
    line-height:1.6;
    color:rgba(17,17,17,.62);
    max-width:420px;
    margin:0 auto 44px;
    font-weight:400;
  }
  /* construction animation */
  .riq-stage{
    position:relative;
    width:100%;
    max-width:360px;
    margin:0 auto 48px;
    padding:28px 0 0;
  }
  .riq-cards{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
    perspective:800px;
  }
  .riq-card{
    width:84px;height:108px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.7);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:12px 10px;
    gap:7px;
  }
  .riq-card::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.8) 50%, transparent 70%);
    transform:translateX(-100%);
    animation:shimmer 3s infinite;
  }
  .riq-card:nth-child(1){animation:cardIn .7s .1s both, cardFloat 4s 1s infinite ease-in-out}
  .riq-card:nth-child(2){animation:cardIn .7s .25s both, cardFloat 4s 1.2s infinite ease-in-out}
  .riq-card:nth-child(3){animation:cardIn .7s .4s both, cardFloat 4s 1.4s infinite ease-in-out}
  .riq-card:nth-child(2){border-color:var(--gold); background:#fff; box-shadow:0 8px 24px rgba(184,152,90,.12)}
  .riq-card .l{height:2px;border-radius:2px;background:var(--line);width:100%}
  .riq-card .l.gold{background:var(--gold);width:60%}
  .riq-card .l.short{width:42%}
  .riq-card .l.med{width:72%}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) rotateX(12deg)}
    to{opacity:1;transform:translateY(0) rotateX(0)}
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
  }
  @keyframes shimmer{
    0%{transform:translateX(-100%)}
    60%,100%{transform:translateX(200%)}
  }
  .riq-track{
    position:relative;
    height:1px;
    background:var(--line);
    width:100%;
    overflow:hidden;
    border-radius:1px;
  }
  .riq-progress{
    position:absolute;
    left:0;top:0;bottom:0;
    width:38%;
    background:var(--gold);
    border-radius:1px;
    animation:progressMove 2.8s infinite cubic-bezier(.7,.1,.3,1);
  }
  .riq-progress::after{
    content:'';
    position:absolute;right:0;top:-3px;
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 4px rgba(184,152,90,.15);
  }
  @keyframes progressMove{
    0%{transform:translateX(-100%)}
    50%{transform:translateX(160%)}
    100%{transform:translateX(350%)}
  }
  .riq-meta{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(17,17,17,.38);
    font-weight:500;
  }
  .riq-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .riq-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:42px;
    padding:0 22px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:500;
    letter-spacing:-.01em;
    text-decoration:none;
    transition:all .2s ease;
    cursor:pointer;
    border:1px solid transparent;
  }
  .riq-btn-primary{
    background:var(--black);
    color:var(--beige);
  }
  .riq-btn-primary:hover{background:#000;transform:translateY(-1px)}
  .riq-btn-ghost{
    background:transparent;
    border-color:var(--black);
    color:var(--black);
  }
  .riq-btn-ghost:hover{background:var(--black);color:var(--beige)}
  .riq-footnote{
    font-size:12px;
    line-height:1.5;
    color:rgba(17,17,17,.45);
  }
  .riq-footnote a{color:var(--black);text-decoration:underline;text-underline-offset:3px}
  .riq-footnote a:hover{color:var(--gold)}
  @media (max-width:480px){
    .riq-biblioteca{padding:28px 18px 48px}
    .riq-cards{gap:10px}
    .riq-card{width:76px;height:98px}
  }
</style>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca - Método RIQSIN</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <script src="/header.js"></script>

  <section class="biblio-hero">
    <span class="eyebrow">Método RIQSIN</span>
    <h1>Biblioteca</h1>
    <p>Materiales disponibles del Método RIQSIN.</p>
  </section>

  <section class="biblio-lista" id="lista-productos">
    <p style="text-align:center; opacity:0.6;">Cargando...</p>
  </section>

  <section class="biblio-aviso">
    <p>Todo lo que compres queda guardado en <strong>Mi Cuenta > Mis versiones</strong>.</p>
  </section>

  <footer>
    <div class="footer-grid">
      <div><h4>RIQSIN</h4><p>Método de investigación y desarrollo — UNAB / UNLa</p></div>
      <div><h4>Secciones</h4><a href="/">Inicio</a><a href="/metodo/">El Método</a><a href="/biblioteca/">Biblioteca</a><a href="/mi-cuenta/">Mi Cuenta</a></div>
      <div><h4>Contacto</h4><a href="https://instagram.com/metodoriqsin">@metodoriqsin</a></div>
    </div>
  </footer>

<script>
  const SUPABASE_URL = 'https://ubxykcmbbitlaeihpcxr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHlrY21iYml0bGFlaWhwY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjczNjEsImV4cCI6MjEwNDY0MzM2MX0.GLaHeLyNSLVeD-xvqBmoWScN_fwyiP4xByQJfjHwOiI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function cargarBiblioteca(){
    const cont = document.getElementById('lista-productos');
    
    // 1. Traer productos
    const { data: productos } = await supabaseClient.from('productos').select('*');
    if(!productos) return;

    // 2. Ver si hay usuario logueado y que compró
    const { data: { user } } = await supabaseClient.auth.getUser();
    let misComprasIds = new Set();
    if(user){
      const { data: compras } = await supabaseClient.from('compras').select('producto_id').eq('user_id', user.id);
      if(compras) misComprasIds = new Set(compras.map(c => c.producto_id));
    }

    // 3. Renderizar
    cont.innerHTML = productos.map(p => {
      const enPosesion = misComprasIds.has(p.id);
      return `
        <a href="/biblioteca/riqsin-v1/" class="biblio-item" style="${enPosesion ? 'border-color: #00ff88;' : ''}">
          <div class="biblio-item-meta">
            <span class="meta-tag riqsin">Método RIQSIN</span>
            <span class="meta-anio">${enPosesion ? 'EN POSESIÓN' : 'v1.0 — Disponible'}</span>
          </div>
          <h3>${p.nombre}</h3>
          <p>${p.descripcion}</p>
          <div class="biblio-item-foot">
            <span>${enPosesion ? 'Ver en Mis Versiones →' : 'Ver detalle →'}</span>
            ${enPosesion 
              ? `<span class="estado" style="background:#00ff88; color:black; padding:4px 10px; border-radius:20px; font-weight:bold; font-size:11px;">EN POSESIÓN</span>`
              : `<span class="estado">COMPRAR — $ ${p.precio.toLocaleString('es-AR')}</span>`
            }
          </div>
        </a>
      `;
    }).join('');
  }

  cargarBiblioteca();
</script>
</body>
</html>

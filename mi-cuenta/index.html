<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta - Método RIQSIN</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .riqsin-auth { max-width: 420px; margin: 60px auto; padding: 40px; background: #0a0a0a; border: 1px solid #222; }
    .riqsin-auth h2 { font-size: 1.1rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 24px; text-align: center; }
    .riqsin-auth input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 14px; margin-bottom: 12px; font-size: 14px; }
    .riqsin-auth button { width: 100%; background: #fff; color: #000; border: none; padding: 14px; text-transform: uppercase; letter-spacing: 0.15em; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .riqsin-auth .tabs { display: flex; gap: 1px; background: #222; margin-bottom: 30px; }
    .riqsin-auth .tabs button { background: #111; color: #888; margin:0; }
    .riqsin-auth .tabs button.active { background: #fff; color: #000; }
    .riqsin-msg { font-size: 13px; margin-top: 12px; text-align: center; color: #888; }
    .riqsin-msg.error { color: #ff4d4d; }
    #dashboard { display: none; max-width: 800px; margin: 60px auto; padding: 40px; }
    .version-card { background: #0a0a0a; border: 1px solid #222; padding: 20px; margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center; }
  </style>
</head>
<body>
  <script src="/header.js"></script>
  <section class="biblio-hero" id="auth-section">
    <div class="riqsin-auth" id="auth-box">
      <h2>Mi Cuenta RIQSIN</h2>
      <div class="tabs">
        <button id="tab-login" class="active" onclick="setTab('login')">Ingresar</button>
        <button id="tab-register" onclick="setTab('register')">Registrarse</button>
      </div>
      <input type="email" id="email" placeholder="EMAIL">
      <input type="password" id="password" placeholder="CONTRASEÑA">
      <button id="main-btn" onclick="handleAuth()">Ingresar</button>
      <div id="message" class="riqsin-msg"></div>
    </div>
  </section>
  <section id="dashboard">
    <h1 style="font-size: 1.2rem; letter-spacing: 0.2em; text-transform: uppercase;">Mi Cuenta</h1>
    <p id="user-email" style="color:#888; margin: 15px 0;"></p>
    <h2 style="margin-top:40px; margin-bottom:20px; font-size:14px; letter-spacing:0.2em; text-transform:uppercase;">Mis versiones</h2>
    <div id="mis-versiones"><p style="opacity:0.6;">Cargando tus versiones...</p></div>
    <button onclick="logout()" style="background:transparent; color:#fff; border:1px solid #333; padding:12px 20px; margin-top:40px; cursor:pointer; text-transform:uppercase; letter-spacing:0.1em; font-size:12px;">Cerrar Sesión</button>
  </section>
<script>
  const SUPABASE_URL = 'https://ubxykcmbbitlaeihpcxr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHlrY21iYml0bGFlaWhwY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjczNjEsImV4cCI6MjEwNDY0MzM2MX0.GLaHeLyNSLVeD-xvqBmoWScN_fwyiP4xByQJfjHwOiI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentTab = 'login';
  function setTab(tab) {
    currentTab = tab;
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('main-btn').innerText = tab === 'login' ? 'Ingresar' : 'Crear Cuenta';
  }
  async function handleAuth() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');
    const btn = document.getElementById('main-btn');
    if(!email || !password) { msg.innerText = 'Completá email y contraseña'; msg.className = 'riqsin-msg error'; return; }
    btn.disabled = true; msg.innerText = 'Procesando...';
    try {
      let result;
      if(currentTab === 'login') result = await supabaseClient.auth.signInWithPassword({ email, password });
      else result = await supabaseClient.auth.signUp({ email, password });
      if(result.error) throw result.error;
      if(currentTab === 'register') { msg.innerText = 'Cuenta creada. Ahora ingresá.'; setTab('login'); }
      else checkUser();
    } catch(e) { msg.innerText = e.message; msg.className = 'riqsin-msg error'; }
    finally { btn.disabled = false; }
  }
  async function checkUser() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(user) {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('user-email').innerText = user.email;
      cargarMisVersiones(user.id);
    }
  }
  async function cargarMisVersiones(userId){
    const cont = document.getElementById('mis-versiones');
    const { data: compras, error } = await supabaseClient.from('compras').select('*, productos(*)').eq('user_id', userId);
    if(error){ cont.innerHTML = '<p>Error cargando</p>'; return; }
    if(!compras || compras.length === 0){
      cont.innerHTML = '<p style="opacity:0.6;">Todavía no tenés versiones. Andá a <a href="/biblioteca/" style="color:white;">Biblioteca</a> para adquirir RIQSIN v1.</p>';
      return;
    }
    cont.innerHTML = compras.map(c => `
      <div class="version-card">
        <div><h3 style="margin:0 0 6px 0;">${c.productos.nombre}</h3><p style="opacity:0.6; font-size:13px; margin:0;">Comprado el ${new Date(c.created_at).toLocaleDateString('es-AR')} — Acceso activo</p></div>
        <span style="background:#00ff88; color:black; padding:6px 12px; font-size:11px; font-weight:bold; letter-spacing:0.1em;">ACTIVO</span>
      </div>
    `).join('');
  }
  async function logout() { await supabaseClient.auth.signOut(); location.reload(); }
  checkUser();
</script>
</body>
</html>
